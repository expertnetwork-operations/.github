name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug] "
type: Bug
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please give enough detail to reproduce the problem. Never paste secrets, tokens, client names or portal credentials.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem as precisely as you can.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Tap / call ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where does this happen? Select all that apply.
      multiple: true
      options:
        - Worker (Cloudflare)
        - Web console
        - MCP
        - iOS
        - iPadOS
        - macOS
        - watchOS
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit / build
      placeholder: e.g. app 1.0 (42), Worker deployment id, or commit SHA
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or request ids
      description: Paste relevant log output (it will be formatted as code). Redact secrets and personal data.
      render: shell
